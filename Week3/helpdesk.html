<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Helpdesk page for the Lab03 project.">
    <meta name="keywords" content="helpdesk, support, Lab03, project">
    <meta name="author" content="Hua Trieu Vi">
    <title>CWA Help Desk Appointment</title>
</head>
<body>
<img src="images/logo.png" alt="Logo">
<h1>CWA Help Desk Appointment</h1>
<p>The Help Desk is located in ATC620. Open 10:30 to 19:00 Monday to Friday.</p>
<p>Check Blackboard for when CWA tutors will be there.</p>
<form method="post" action="http://mercury.swin.edu.au/it000000/formtest.php">
<!-- This is Student details fieldset -->
<fieldset>
    <legend>Student details</legend>
    <p>
        <label for="StudentID">Student ID:</label>
        <input type="text" id="StudentID" name="StudentID" required="required" pattern="[0-9]{7,10}">
    </p>
    <p>
        <label for="given_name">Given Name</label>
        <input type="text" name="given_name" id="given_name" maxlength="15" required="required" pattern="[A-Za-z\s]+" />
            
        <label for="family_name">Family Name</label>
        <input type="text" name="family_name" id="family_name" maxlength="15" required="required" pattern="[A-Za-z\s]+" />
    </p>
</fieldset>
<!-- This is Your Unit fieldset -->
<fieldset>
    <legend>Your Unit</legend>
    <!-- This is the radio group -->
    <p>
        <input type="radio" id="cos10011" name="unit" required="required">
        <label for="cos10011">COS10011</label>
        <input type="radio" id="cos60004" name="unit" required="required">
        <label for="cos60004">COS60004</label>
        <input type="radio" id="cos60007" name="unit" required="required">
        <label for="cos60007">COS60007</label>
    </p>
    <!-- This is the list of tutors -->
    <p>
        <label for="tutor">Your Tutor:</label>
        <select name="tutor" id="tutor" required="required">
            <option value="">Please select your tutor</option>
            <option value="tutor1">Wilson 1</option>
            <option value="tutor2">Wilson 2</option>
            <option value="tutor3">Wilson 3</option>
    </select>
    </p>
</fieldset>
<!-- This is the issue fieldset -->
<fieldset>
    <legend>Issue</legend>
    <!-- This is the checkbox group -->
    <p>
        <label for="html">HTML</label>
        <input type="checkbox" id="html" name="issue[]" value="html" checked="checked">
        <label for="css">CSS</label>
        <input type="checkbox" id="css" name="issue[]" value="css">
        <label for="javascript">JavaScript</label>
        <input type="checkbox" id="javascript" name="issue[]" value="javascript">
        <label for="php">PHP</label>
        <input type="checkbox" id="php" name="issue[]" value="php">
        <label for="mysql">MySQL</label>
        <input type="checkbox" id="mysql" name="issue[]" value="mysql">
    </p>
    <!-- this is the textarea for the issue description -->
    <p>
        <label for="description">Description of the issue:</label>
        <textarea id="description" name="description" rows="4" cols="50" placeholder="Write description here..." required="required"></textarea>
    </p>
</fieldset>
<!-- This is the preferred date/time fieldset -->
<fieldset>
    <legend>Preferred Date and Time</legend>
    <!-- This is the preferred date -->
    <p>
        <label for="preferred_date">Preferred Date:</label>
        <input type="text" id="preferred_date" name="preferred_date" placeholder="dd/mm/yyyy" required="required" pattern="(0[1-9]|[12][0-9]|3[01])/(0[1-9]|1[0-2])/[0-9]{4}">
    </p>
    <!-- This is the preferred time -->
    <p>
        <label for="preferred_time">Preferred Time:</label>
        <input type="text" id="preferred_time" name="preferred_time" placeholder="00:00" required="required" pattern="([01]?[0-9]|2[0-3]):[0-5][0-9]">
    </p>
</fieldset>
<!-- Buttons -->
<input type= "submit" value="Register"/>
<input type= "reset" value="Reset Form"/>
</form>
</body>
</html>
